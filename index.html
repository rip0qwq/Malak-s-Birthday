<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy BirthDay to Malak</title>
<meta name="theme-color" content="#0b0e2e" id="themeMeta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@800&family=Cormorant+Garamond:ital,wght@1,500&family=Great+Vibes&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    overflow-x:hidden;
    font-family:'Aref Ruqaa','Amiri','Noto Naskh Arabic',serif;
    --c-ar:#ffe6f1;  --c-en:#ffd27a;  --c-date:rgba(255,230,242,.72);
    --c-wish:#ffe7b0; --c-final:#ffe7b0; --glow:rgba(255,170,215,.5);
    background:#090c2b;
  }
  body.pink{
    --c-ar:#8a1a4d; --c-en:#d6336c; --c-date:rgba(138,26,77,.75);
    --c-final:#a31457; --glow:rgba(214,51,108,.0);
  }

  /* ---------- sky layers ---------- */
  .sky,.dawn,.stars{position:fixed;inset:0;pointer-events:none}
  .sky{background:radial-gradient(120% 85% at 50% 108%,#43307f 0%,#1b1752 46%,#080b29 100%)}
  .dawn{
    background:
      radial-gradient(90% 55% at 50% 38%,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 70%),
      radial-gradient(120% 90% at 50% 0%,#fff1f7 0%,#ffd3e5 38%,#ffa8c8 100%);
    opacity:0;transition:opacity 2.8s ease;
  }
  body.pink .dawn{opacity:1}
  .stars{transition:opacity 1.6s ease}
  body.pink .stars{opacity:0}
  .star{position:absolute;border-radius:50%;background:#fff;opacity:.2;animation:tw var(--t) ease-in-out infinite alternate;animation-delay:var(--dl)}
  @keyframes tw{to{opacity:var(--o)}}

  /* ---------- layout ---------- */
  main{
    position:relative;z-index:2;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
    gap:6px;max-width:560px;margin:0 auto;text-align:center;
  }

  /* ---------- the name ---------- */
  .hero{display:flex;flex-direction:column;align-items:center}
  .name-ar{
    font-family:'Aref Ruqaa','Amiri',serif;font-weight:700;
    font-size:clamp(76px,21vw,136px);line-height:1.02;
    color:var(--c-ar);
    text-shadow:0 0 34px var(--glow),0 0 3px rgba(255,255,255,.55);
    transition:color 2.4s ease,text-shadow 2.4s ease;
    animation:nameIn 1.4s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes nameIn{from{opacity:0;filter:blur(18px);transform:scale(.93)}to{opacity:1;filter:blur(0);transform:scale(1)}}
  .name-en{
    font-family:'Great Vibes','Snell Roundhand','Apple Chancery',cursive;
    font-size:clamp(46px,13vw,76px);line-height:1;margin-top:-.12em;
    color:var(--c-en);letter-spacing:.01em;
    text-shadow:0 0 22px rgba(255,210,122,.35);
    transition:color 2.4s ease,text-shadow 2.4s ease;
  }
  body.pink .name-en{text-shadow:none}
  .date{
    margin-top:8px;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;
    font-size:21px;letter-spacing:.16em;color:var(--c-date);
    transition:color 2.4s ease;animation:fade 1s ease 1.6s both;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* handwriting per-letter wipe */
  .ch{display:inline-block;clip-path:inset(-45% 100% -45% -45%)}
  .go .ch{animation:pen .24s linear both;animation-delay:var(--d)}
  @keyframes pen{to{clip-path:inset(-45% -45% -45% -45%)}}

  /* ---------- the cake ---------- */
  .cake-wrap{
    position:relative;width:min(80vw,400px,calc(40svh * 1.333));
    --lit:1;
  }
  .cake-wrap::before{
    content:"";position:absolute;left:5%;right:5%;top:2%;height:58%;
    background:radial-gradient(ellipse at 50% 55%,rgba(255,186,100,.42),rgba(255,186,100,0) 68%);
    opacity:var(--lit);transition:opacity 1.2s ease;pointer-events:none;
  }
  .cake{position:relative;display:block;width:100%;height:auto;overflow:visible}
  .candle{cursor:pointer;outline:none}
  .candle:focus-visible .stick{stroke:#fff;stroke-width:1.6}
  .ig{animation:ignite .5s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:var(--d);transform-box:fill-box;transform-origin:50% 100%}
  @keyframes ignite{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .16s ease-in-out infinite alternate;animation-delay:var(--fd)}
  @keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}100%{transform:scale(.93,1.09) rotate(2.6deg)}}
  .halo{animation:halo 1.4s ease-in-out infinite alternate;animation-delay:var(--fd)}
  @keyframes halo{from{opacity:.75}to{opacity:1}}
  .candle.out .ig{opacity:0;transition:opacity .22s ease-out}
  .candle.out .wick{animation:ember 1.6s ease-out forwards}
  @keyframes ember{0%{stroke:#ff9a5a}100%{stroke:#3b2630}}
  .smoke{
    fill:rgba(240,240,250,.75);filter:url(#blur);opacity:0;
    transform-box:fill-box;transform-origin:center;
    animation:smk 2.5s ease-out both;
  }
  @keyframes smk{
    0%{opacity:0;transform:translate(0,0) scale(.6)}
    14%{opacity:.8}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(3.6)}
  }

  /* ---------- prompt / final line ---------- */
  .prompt{display:grid;place-items:center;min-height:116px;width:100%}
  .wish,.final{grid-area:1/1;display:flex;flex-direction:column;align-items:center;transition:opacity .7s ease,transform .7s ease,visibility .7s}
  .wish{animation:fadeUp .8s ease 1.7s backwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
  .wish-text{
    font-family:'Aref Ruqaa',serif;font-weight:700;font-size:36px;line-height:1.2;color:var(--c-wish);
    text-shadow:0 0 18px rgba(255,215,140,.45);margin-bottom:14px;
    animation:breathe 3.2s ease-in-out infinite alternate;
  }
  @keyframes breathe{from{text-shadow:0 0 10px rgba(255,215,140,.25)}to{text-shadow:0 0 26px rgba(255,215,140,.65)}}
  .blow{
    font-family:'Cairo','Tajawal',sans-serif;font-weight:800;font-size:20px;color:#3a0f2e;
    padding:13px 36px;border:0;border-radius:999px;cursor:pointer;
    background:linear-gradient(135deg,#ffd27a,#ff8fb1);
    box-shadow:0 10px 26px rgba(255,143,177,.38),inset 0 0 0 1px rgba(255,255,255,.45);
    transition:transform .18s ease,box-shadow .18s ease,filter .3s;
  }
  .blow:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(255,143,177,.46),inset 0 0 0 1px rgba(255,255,255,.55)}
  .blow:active{transform:scale(.96)}
  .blow:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .blow:disabled{filter:saturate(.6) brightness(.9);cursor:default;transform:none}

  .final{opacity:0;visibility:hidden;transform:scale(.96)}
  .final p{
    font-family:'Aref Ruqaa',serif;font-weight:700;font-size:clamp(36px,10.5vw,56px);line-height:1.35;
    color:var(--c-final);text-shadow:0 2px 0 rgba(255,255,255,.55),0 8px 26px rgba(214,51,108,.22);
    transition:color 2.4s ease;
  }
  .final span{display:inline-block;opacity:0;transform:translateY(16px) scale(.8)}
  .done .wish{opacity:0;visibility:hidden;transform:translateY(-10px)}
  .done .final{opacity:1;visibility:visible;transform:none}
  .done .final span{animation:wordIn .85s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:calc(var(--i) * .17s + .25s)}
  @keyframes wordIn{to{opacity:1;transform:none}}

  /* ---------- signature ---------- */
  .sigwrap{min-height:98px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;color:#5b1237;direction:ltr}
  .sig{
    font-family:'Mrs Saint Delafield','Great Vibes',cursive;font-size:clamp(56px,16vw,80px);
    line-height:1;white-space:nowrap;color:#5b1237;
  }
  .rule{position:relative;width:min(220px,58vw);height:6px;margin-top:6px}
  .rule .line{
    position:absolute;left:0;right:3px;top:2.5px;height:1px;
    background:linear-gradient(90deg,rgba(91,18,55,0),#5b1237 28%);
    transform:scaleX(0);transform-origin:left;transition:transform 1.1s cubic-bezier(.55,.1,.2,1);
  }
  .rule .dot{
    position:absolute;right:0;top:0;width:6px;height:6px;border-radius:50%;background:#5b1237;
    transform:scale(0);transition:transform .5s cubic-bezier(.3,1.9,.5,1) 1s;
  }
  .rule.go .line{transform:scaleX(1)}
  .rule.go .dot{transform:scale(1)}

  /* ---------- sound toggle ---------- */
  .mute{
    position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:10;width:40px;height:40px;border-radius:50%;
    border:0;background:rgba(255,255,255,.14);color:var(--c-ar);display:grid;place-items:center;cursor:pointer;
    backdrop-filter:blur(6px);transition:color 2.4s ease,background .3s;
  }
  .mute:hover{background:rgba(255,255,255,.26)}
  .mute:focus-visible{outline:2px solid currentColor;outline-offset:2px}
  .mute svg{width:20px;height:20px}
  .mute .off{display:none}
  .mute.muted .on{display:none}
  .mute.muted .off{display:block}

  canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true"></div>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="dawn" aria-hidden="true"></div>

<button class="mute" id="mute" aria-label="الصوت" title="الصوت">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
</button>

<main>
  <header class="hero">
    <h1 class="name-ar">ملك</h1>
    <p class="name-en go" id="nameEn" lang="en" dir="ltr">Malak</p>
    <p class="date" dir="ltr"><time datetime="2026-11-15">15/11/2026</time></p>
  </header>

  <div class="cake-wrap" id="cakeWrap">
    <svg class="cake" id="cake" viewBox="0 40 360 270" role="img" aria-label="كيكة عيد ميلاد عليها شمع">
      <defs>
        <linearGradient id="gTop" x1="0" x2="1"><stop offset="0" stop-color="#ffa6c3"/><stop offset="1" stop-color="#ff6b98"/></linearGradient>
        <linearGradient id="gBot" x1="0" x2="1"><stop offset="0" stop-color="#c2aeff"/><stop offset="1" stop-color="#8b6eed"/></linearGradient>
        <linearGradient id="shade" x1="0" x2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".32"/>
          <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".16"/>
        </linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#ffc66e" stop-opacity=".8"/><stop offset="1" stop-color="#ff9f4a" stop-opacity="0"/></radialGradient>
        <linearGradient id="flameO" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a2f"/><stop offset="1" stop-color="#ffd45e"/></linearGradient>
        <linearGradient id="flameI" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#fffbe8"/></linearGradient>
        <filter id="blur" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="1.7"/></filter>
      </defs>

      <!-- plate -->
      <ellipse cx="180" cy="296" rx="160" ry="13" fill="#000" opacity=".25"/>
      <ellipse cx="180" cy="289" rx="152" ry="12" fill="#f4effd"/>
      <ellipse cx="180" cy="286" rx="140" ry="8.5" fill="#e3daf6"/>

      <!-- bottom tier -->
      <rect x="50" y="205" width="260" height="81" rx="12" fill="url(#gBot)"/>
      <rect x="50" y="205" width="260" height="81" rx="12" fill="url(#shade)"/>
      <rect x="50" y="238" width="260" height="9" fill="#fff" opacity=".24"/>
      <g fill="#fff6ee">
        <circle cx="74" cy="266" r="4.2"/><circle cx="101" cy="266" r="4.2"/><circle cx="128" cy="266" r="4.2"/>
        <circle cx="155" cy="266" r="4.2"/><circle cx="182" cy="266" r="4.2"/><circle cx="209" cy="266" r="4.2"/>
        <circle cx="236" cy="266" r="4.2"/><circle cx="263" cy="266" r="4.2"/><circle cx="290" cy="266" r="4.2"/>
      </g>
      <path d="M50 219Q50 205 64 205H296Q310 205 310 219V223q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0Z" fill="#fff6ee"/>

      <!-- top tier -->
      <rect x="90" y="146" width="180" height="64" rx="12" fill="url(#gTop)"/>
      <rect x="90" y="146" width="180" height="64" rx="12" fill="url(#shade)"/>
      <g>
        <rect x="108" y="186" width="9" height="3.4" rx="1.7" fill="#ffd166" transform="rotate(24 112 188)"/>
        <rect x="132" y="196" width="9" height="3.4" rx="1.7" fill="#fff" transform="rotate(-30 136 198)"/>
        <rect x="154" y="184" width="9" height="3.4" rx="1.7" fill="#7ae0c3" transform="rotate(60 158 186)"/>
        <rect x="178" y="195" width="9" height="3.4" rx="1.7" fill="#ffd166" transform="rotate(-12 182 197)"/>
        <rect x="200" y="185" width="9" height="3.4" rx="1.7" fill="#8fb8ff" transform="rotate(35 204 187)"/>
        <rect x="222" y="196" width="9" height="3.4" rx="1.7" fill="#fff" transform="rotate(-50 226 198)"/>
        <rect x="244" y="186" width="9" height="3.4" rx="1.7" fill="#ffd166" transform="rotate(18 248 188)"/>
      </g>

      <!-- candles (behind the icing so they sit in it) -->
      <g id="candles"></g>

      <path d="M90 160Q90 146 104 146H256Q270 146 270 160V164q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0q-10 16-20 0Z" fill="#fff6ee"/>

      <g id="smokeLayer" pointer-events="none"></g>
    </svg>
  </div>

  <section class="prompt" id="prompt" aria-live="polite">
    <div class="wish">
      <p class="wish-text">اتمني أمنية</p>
      <button class="blow" id="blow" type="button" disabled>اطفي الشمع</button>
    </div>
    <div class="final">
      <p><span style="--i:0">كل</span> <span style="--i:1">سنة</span> <span style="--i:2">وانتي</span> <span style="--i:3">طيبة</span></p>
    </div>
  </section>

  <footer class="sigwrap">
    <p class="sig" id="sig" lang="en" dir="ltr">by omar youssef</p>
    <div class="rule" id="rule"><span class="line"></span><span class="dot"></span></div>
  </footer>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= stars ================= */
  const starsEl = $('#stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i');
    s.className = 'star';
    const z = Math.random() * 2.2 + .8;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;` +
      `--t:${2+Math.random()*3}s;--dl:${-Math.random()*4}s;--o:${.5+Math.random()*.5}`;
    starsEl.appendChild(s);
  }

  /* ================= handwriting split ================= */
  function split(el, start, step) {
    const t = el.textContent;
    el.textContent = '';
    el.setAttribute('aria-label', t);
    const chars = [...t];
    chars.forEach((c, i) => {
      const s = document.createElement('span');
      s.className = 'ch';
      s.setAttribute('aria-hidden', 'true');
      s.style.setProperty('--d', (start + i * step) + 's');
      s.textContent = c === ' ' ? '\u00A0' : c;
      el.appendChild(s);
    });
    return chars;
  }
  split($('#nameEn'), .7, .12);
  const sigEl = $('#sig');
  const sigChars = split(sigEl, 0, .11);

  /* ================= candles ================= */
  const xs = [120, 150, 180, 210, 240];
  const cols = ['#ff6b9a', '#ffd166', '#7ae0c3', '#8fb8ff', '#b79cff'];
  const candleLayer = $('#candles');
  candleLayer.innerHTML = xs.map((x, i) => `
    <g transform="translate(${x} 0)">
      <g class="candle" data-i="${i}" role="button" tabindex="0" aria-label="اطفي الشمعة ${i+1}">
        <rect class="stick" x="-5" y="104" width="10" height="46" rx="2.6" fill="${cols[i]}"/>
        <path d="M-5 114l10-5M-5 124l10-5M-5 134l10-5M-5 144l10-5" stroke="#fff" stroke-opacity=".6" stroke-width="2.4"/>
        <rect x="-5" y="104" width="10" height="46" rx="2.6" fill="url(#shade)"/>
        <line class="wick" x1="0" y1="104" x2="0" y2="98.5" stroke="#3b2630" stroke-width="1.8" stroke-linecap="round"/>
        <g transform="translate(0 99)">
          <g class="ig" style="--d:${(1.1 + i * .1).toFixed(2)}s">
            <g class="fl" style="--fd:${(i * .037 % .14).toFixed(3)}s">
              <circle class="halo" cy="-13" r="25" fill="url(#glow)" style="--fd:${(i*.2).toFixed(2)}s"/>
              <path d="M0 0C-6.5-6-6-14 0-25 6-14 6.5-6 0 0Z" fill="url(#flameO)"/>
              <path d="M0-.5C-3-4-3-8 0-14 3-8 3-4 0-.5Z" fill="url(#flameI)"/>
            </g>
          </g>
        </g>
        <rect x="-15" y="58" width="30" height="88" fill="transparent"/>
      </g>
    </g>`).join('');
  const candleEls = [...candleLayer.querySelectorAll('.candle')];
  const smokeLayer = $('#smokeLayer');
  const wrap = $('#cakeWrap');
  let ready = false, celebrating = false, outCount = 0;
  setTimeout(() => { ready = true; $('#blow').disabled = false; }, 2300);

  function smoke(i) {
    const x = xs[i];
    for (let k = 0; k < 5; k++) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', x + (Math.random() - .5) * 2);
      c.setAttribute('cy', 90);
      c.setAttribute('r', (2 + Math.random() * 1.6).toFixed(2));
      c.setAttribute('class', 'smoke');
      c.style.setProperty('--dx', ((Math.random() - .5) * 16 + Math.sin(k * 1.7) * 7).toFixed(1) + 'px');
      c.style.setProperty('--dy', (-(38 + Math.random() * 36)).toFixed(1) + 'px');
      c.style.animationDelay = (k * .11) + 's';
      smokeLayer.appendChild(c);
      c.addEventListener('animationend', () => c.remove());
    }
  }

  function extinguish(i, silent) {
    const el = candleEls[i];
    if (!ready || el.classList.contains('out')) return;
    el.classList.add('out');
    outCount++;
    wrap.style.setProperty('--lit', ((candleEls.length - outCount) / candleEls.length).toFixed(2));
    smoke(i);
    if (!silent) Snd.puff(.45);
    if (outCount === candleEls.length) celebrate();
  }

  candleEls.forEach((el, i) => {
    el.addEventListener('pointerdown', e => { e.preventDefault(); Snd.ensure(); extinguish(i, false); });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); Snd.ensure(); extinguish(i, false); }
    });
  });

  const blowBtn = $('#blow');
  blowBtn.addEventListener('click', async () => {
    Snd.ensure();
    if (!ready || blowBtn.disabled) return;
    blowBtn.disabled = true;
    const remaining = candleEls.map((c, i) => i).filter(i => !candleEls[i].classList.contains('out'));
    Snd.whoosh();
    for (const i of remaining) { extinguish(i, true); await sleep(95); }
  });

  /* ================= celebration ================= */
  async function celebrate() {
    if (celebrating) return;
    celebrating = true;
    blowBtn.disabled = true;
    await sleep(700);
    document.body.classList.add('pink');
    $('#themeMeta').content = '#ffb3d1';
    await sleep(600);

    const r = $('#cake').getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height * .32;
    Snd.pops();
    burst(cx, cy, reduce ? 40 : 130, { angle: -Math.PI / 2, spread: 1.7, power: 1 });
    await sleep(260);
    Snd.sparkle();
    burst(innerWidth * .04, innerHeight * .8, reduce ? 0 : 55, { angle: -1.05, spread: .7, power: 1.15 });
    burst(innerWidth * .96, innerHeight * .8, reduce ? 0 : 55, { angle: -Math.PI + 1.05, spread: .7, power: 1.15 });
    rain(reduce ? 0 : 4200);
    await sleep(350);
    $('#prompt').classList.add('done');
    Snd.melody();
    await sleep(2300);

    // signature: written letter by letter, then the thin rule with its dot
    sigEl.classList.add('go');
    Snd.scratch(sigChars.map((c, i) => c === ' ' ? null : i * .11).filter(v => v !== null));
    const writeEnd = sigChars.length * .11 + .3;
    await sleep(writeEnd * 1000);
    $('#rule').classList.add('go');
    await sleep(1650);
    Snd.ting();
  }

  /* ================= confetti ================= */
  const cv = $('#confetti'), g = cv.getContext('2d');
  let W, H, DPR;
  function size() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', size); size();
  const palette = ['#ff5c93', '#ffd166', '#7ae0c3', '#8fb8ff', '#b79cff', '#ff9e6b', '#ffffff', '#ff8fb1'];
  let parts = [], rainUntil = 0, running = false;

  function mk(x, y, vx, vy) {
    return {
      x, y, vx, vy, w: 6 + Math.random() * 7, h: 4 + Math.random() * 6,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .35,
      c: palette[(Math.random() * palette.length) | 0],
      round: Math.random() < .22, wob: Math.random() * 6.28, ws: .05 + Math.random() * .12
    };
  }
  function burst(x, y, n, o) {
    for (let i = 0; i < n; i++) {
      const a = o.angle + (Math.random() - .5) * o.spread;
      const sp = (7 + Math.random() * 11) * o.power;
      parts.push(mk(x, y, Math.cos(a) * sp, Math.sin(a) * sp));
    }
    kick();
  }
  function rain(ms) { rainUntil = performance.now() + ms; kick(); }
  function kick() { if (!running) { running = true; requestAnimationFrame(loop); } }
  function loop(t) {
    g.clearRect(0, 0, W, H);
    if (t < rainUntil) {
      for (let i = 0; i < 3; i++) parts.push(mk(Math.random() * W, -14, (Math.random() - .5) * 1.4, 2 + Math.random() * 3));
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vy += .22; p.vx *= .991; p.vy *= .991;
      p.x += p.vx + Math.sin(p.wob) * .6; p.y += p.vy;
      p.rot += p.vr; p.wob += p.ws;
      if (p.y > H + 24) { parts.splice(i, 1); continue; }
      g.save();
      g.translate(p.x, p.y); g.rotate(p.rot);
      g.fillStyle = p.c;
      if (p.round) { g.beginPath(); g.arc(0, 0, p.w * .38, 0, 6.283); g.fill(); }
      else g.fillRect(-p.w / 2, -p.h / 2, p.w, Math.max(1, p.h * Math.abs(Math.cos(p.wob))));
      g.restore();
    }
    if (parts.length || t < rainUntil) requestAnimationFrame(loop);
    else { running = false; g.clearRect(0, 0, W, H); }
  }

  /* ================= sound (Web Audio, no files needed) ================= */
  const Snd = (() => {
    let AC = null, master, bus, noise, muted = false;
    const F = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };

    function ensure() {
      if (!AC) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        AC = new C();
        master = AC.createGain(); master.gain.value = muted ? 0 : .9; master.connect(AC.destination);
        // small hall reverb for the music-box shimmer
        const len = AC.sampleRate * 2.2, ir = AC.createBuffer(2, len, AC.sampleRate);
        for (let c = 0; c < 2; c++) {
          const d = ir.getChannelData(c);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
        }
        const conv = AC.createConvolver(); conv.buffer = ir;
        const wet = AC.createGain(); wet.gain.value = .38;
        bus = AC.createGain(); bus.connect(master); bus.connect(wet); wet.connect(conv); conv.connect(master);
        // shared white-noise buffer
        noise = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
        const nd = noise.getChannelData(0);
        for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      }
      if (AC.state === 'suspended') AC.resume();
      return AC;
    }
    document.addEventListener('pointerdown', ensure, { passive: true });
    document.addEventListener('keydown', ensure, { passive: true });

    function noiseHit({ t, dur, type = 'bandpass', f0, f1, q = 1, vol = .3, attack = .02, off }) {
      const s = AC.createBufferSource(); s.buffer = noise;
      const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const gn = AC.createGain();
      gn.gain.setValueAtTime(.0001, t);
      gn.gain.exponentialRampToValueAtTime(vol, t + attack);
      gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
      s.connect(f); f.connect(gn); gn.connect(master);
      s.start(t, off ?? Math.random() * 1.4, dur + .05);
    }
    function tone(type, f, t, dur, vol, to) {
      const o = AC.createOscillator(), gn = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      gn.gain.setValueAtTime(.0001, t);
      gn.gain.exponentialRampToValueAtTime(vol, t + .004);
      gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + .05);
    }
    function bell(f, t, vol = .15, d = 1.5) {
      [[1, 1, d], [2.01, .3, d * .5], [3.98, .1, d * .25]].forEach(([m, a, dd]) => {
        const o = AC.createOscillator(), gn = AC.createGain();
        o.type = 'sine'; o.frequency.value = f * m;
        gn.gain.setValueAtTime(.0001, t);
        gn.gain.exponentialRampToValueAtTime(vol * a, t + .006);
        gn.gain.exponentialRampToValueAtTime(.0001, t + dd);
        o.connect(gn); gn.connect(bus); o.start(t); o.stop(t + dd + .05);
      });
    }

    return {
      ensure,
      toggle() {
        muted = !muted;
        if (master) master.gain.value = muted ? 0 : .9;
        return muted;
      },
      // one candle: short soft puff
      puff(v = .4) {
        if (!AC) return; const t = AC.currentTime;
        noiseHit({ t, dur: .34, f0: 1900, f1: 520, q: .9, vol: v, attack: .035 });
        tone('sine', 220, t, .12, .05, 120);
      },
      // all candles: one long breath
      whoosh() {
        if (!AC) return; const t = AC.currentTime;
        noiseHit({ t, dur: 1.0, f0: 380, f1: 1700, q: .7, vol: .55, attack: .16 });
        noiseHit({ t: t + .05, dur: .8, type: 'highpass', f0: 1500, f1: 3500, q: .5, vol: .08, attack: .2 });
      },
      // party poppers
      pops() {
        if (!AC) return; const t0 = AC.currentTime;
        [0, .13, .27].forEach((d, i) => {
          const t = t0 + d, v = i === 0 ? .6 : .38;
          noiseHit({ t, dur: .2, type: 'highpass', f0: 900, f1: 5200, q: .6, vol: v, attack: .003 });
          tone('sine', 190, t, .14, v * .8, 55);
        });
        // streamer fizz
        noiseHit({ t: t0 + .05, dur: .7, type: 'bandpass', f0: 5000, f1: 2500, q: 2.2, vol: .06, attack: .05 });
      },
      sparkle() {
        if (!AC) return; const t0 = AC.currentTime;
        const sc = [1046.5, 1318.5, 1568, 1760, 2093, 2637, 3136];
        for (let i = 0; i < 12; i++) bell(sc[(Math.random() * sc.length) | 0], t0 + i * .07 + Math.random() * .03, .05, .9);
      },
      // music-box melody (simple, played once)
      melody() {
        if (!AC) return;
        const beat = .5; let t = AC.currentTime + .1;
        const L = [
          ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
          ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
          ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 1],
          ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3]
        ];
        L.forEach(([n, b]) => { bell(F[n], t, .14, 1.7); t += b * beat; });
        // soft low notes underneath
        const base = AC.currentTime + .1;
        [0, 3, 6, 9, 12, 15, 18, 21, 24].forEach((b, i) => {
          tone('triangle', i % 2 ? 196 : 130.81, base + b * beat, 1.1, .05);
        });
      },
      // pen on paper, one tiny scratch per letter
      scratch(times) {
        if (!AC) return; const t0 = AC.currentTime + .03;
        times.forEach(d => {
          noiseHit({
            t: t0 + d, dur: .1, f0: 2600 + Math.random() * 1600, f1: 3600 + Math.random() * 1400,
            q: 2.5, vol: .05, attack: .02
          });
        });
      },
      ting() {
        if (!AC) return; const t = AC.currentTime;
        bell(2093, t, .09, 1.6); bell(3136, t + .09, .05, 1.4);
      }
    };
  })();

  const muteBtn = $('#mute');
  muteBtn.addEventListener('click', () => {
    const m = Snd.toggle();
    muteBtn.classList.toggle('muted', m);
    muteBtn.setAttribute('aria-pressed', String(m));
  });
})();
</script>
</body>
</html>
